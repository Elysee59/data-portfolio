name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Invoice extractor tests
        working-directory: 03-ai-invoice-extraction
        run: pytest -q
      - name: HR analytics runs end to end
        working-directory: 01-hr-analytics
        run: python src/generate_data.py && python src/analysis.py
      - name: Forecasting runs end to end
        working-directory: 02-sales-forecasting
        run: python src/generate_data.py && python src/forecast.py
